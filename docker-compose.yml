version: '3.8'
services:
  client:
    build:
      context: .
      dockerfile: packages/client/Dockerfile
    ports:
      - "5173:5173"
    volumes:
      - ./client:/app/client
    environment:
      - NODE_ENV=development

  server:
    build:
      context: .
      dockerfile: packages/server/Dockerfile
    ports:
      - "5000:5000"
    volumes:
      - ./packages/server:/app/packages/server
    environment:
      - NODE_ENV=development
      - CLIENT_URL=http://localhost:5173
    stdin_open: true
    tty: true